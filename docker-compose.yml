services:
  backend:
    build: ./backend
    container_name: zyxf-backend
    restart: unless-stopped
    # Replaces the tini entrypoint previously installed via apt (keeps the
    # image build free of Debian-mirror downloads).
    init: true
    # Backend is internal-only; frontend container reaches it via docker DNS.
    expose:
      - "4000"
    environment:
      PORT: 4000
      DB_PATH: /data/data.db
      NODE_ENV: production
      # The frontend nginx proxies same-origin, so CORS_ORIGIN can stay narrow.
      # Set it to your public URL (or * for testing).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      OSS_REGION: ${OSS_REGION:?OSS_REGION is required}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-zyxf/}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      IMM_STYLE: ${IMM_STYLE:-}
      # AI 资料助手（可选）：三者齐全才启用，未配置时聊天接口返回 503
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - zyxf-data:/data

  frontend:
    build: ./frontend
    container_name: zyxf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  zyxf-data:
