# 站点共享的安全响应头。由部署拷到 /etc/nginx/snippets/zyxf-headers.conf，
# 在 server 级与每个「自己写了 add_header」的 location 里 include。
#
# ⚠️ 为什么要抽文件：nginx 的 add_header 在子级一旦出现就**不再继承**父级的那一组。
#    之前把这几个头在每个 location 里手抄一遍，结果 HSTS 漏抄了半年没人发现
#    （2026-11 实测：线上没有 HSTS，而 DEPLOY.md 声称每个 location 都声明了）。
#    现在唯一来源就是本文件——加头/改策略只改这里。
#
# CSP 说明：
#   script-src 'self'   构建产物无内联脚本，也无 eval / new Function
#                       （2026-11 静态审计：dist 里 `eval(` 与 `new Function(` 均 0 命中）
#   style-src unsafe-inline  React 内联 style 属性 / gsap 的运行时样式必需
#   connect-src https:  API + OSS 签名直链 + 用户自带 LLM 地址
#   frame-src 'self' blob:  PDF 预览（fetch 成 blob URL 再塞进 iframe），少了它会整块白屏
#   img-src https:      文件缩略图 / 外链图片
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS 不加 includeSubDomains：dzhz / oss 是独立配置的子域，一刀切会把将来任何纯 HTTP 的
# 子域永久锁死。确认全部子域都上 HTTPS 后再加。
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 本站不需要任何传感器 / 支付能力，全部显式关掉，减少被嵌页或第三方脚本利用的面。
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# 同源开窗隔离：阻止外部页面通过 window.opener 反向操作本站（与 CSP 的 frame-ancestors 互补）。
add_header Cross-Origin-Opener-Policy "same-origin" always;
