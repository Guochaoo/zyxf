# ============================================================================
# zyxf.top — 静态资源缓存 / 安全响应头 / SPA 回退
# ============================================================================
# 本文件由仓库 frontend/nginx.conf 同步而来（BUG-100）。生产站点由宝塔面板托管，
# 面板不会读取仓库里的那份模板，所以这些 location 必须落在面板 include 的文件里：
#   面板：网站 → 设置 → 伪静态  ==  /www/server/panel/vhost/rewrite/zyxf.top.conf
# 修改 vhost 本体（vhost/nginx/zyxf.top.conf）无效——面板保存设置时会重写它。
#
# ⚠️ nginx 的 add_header **不会被子级 location 继承**：任何自己写了 add_header 的
#    location 都会屏蔽 server 级的 HSTS / Alt-Svc。下面每个 location 都重复声明了
#    安全头，缺一个就会在那一类路径上静默丢失。
# ⚠️ 改完必须：/www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#    （宝塔的 nginx 不是 systemd 服务，systemctl reload nginx 会报未激活。）
#
# ⚠️ CSP 目前是 **Report-Only**（只上报、不拦截）。原因：OfficeViewer 会从
#    https://g.alicdn.com/IMM/office-js/... 注入 <script>，随后该脚本再 appendChild
#    加载同目录的 wps.js——script-src 必须显式放行 g.alicdn.com，否则在线预览会整块失效。
#    先用 Report-Only 在真实浏览器里把「预览 / 上传 / 图谱 / AI 对话」都点一遍，确认控制台
#    没有 CSP 违规后，再把下面每处的 `Content-Security-Policy-Report-Only` 改回
#    `Content-Security-Policy`（本文件里共 4 处，缺一处那一类路径就没有策略）。

# 带内容 hash 的构建产物（index-<hash>.js / .css / 字体 woff2）：可长缓存 + immutable。
# 内容变了文件名就变，所以一年 + immutable 是安全的。
# ⚠️ 必须写 `^~`：nginx 的**正则 location 优先级高于普通前缀 location**，而下面那条按
#    扩展名匹配的正则也含 woff2——不加 `^~` 时 /assets/*.woff2 会被它抢走、只拿到 7 天。
#    字体是首屏最大的单个资源（2.7 MB），值得走 immutable；`^~` 的含义正是
#    「本前缀命中后不再检查正则」，于是 /assets/ 下的一切都按下面这套走。
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 不存在的 hash 资源必须回 404：回 index.html（SPA 回退）会让 <script type="module">
    # 拿到 text/html 而被浏览器拒绝执行，表现为整页白屏。
    try_files $uri =404;
}

# /assets/ 之外的静态资源（图片 / 图标）：这些文件名里**没有内容 hash**，
# 所以用 7 天而不是一年，换掉一个资源后不至于在客户端卡住一年。
# 不加这一段时 nginx 不给任何 Cache-Control，浏览器按「10% × (Date − Last-Modified)」
# 做启发式缓存，静态图每次冷启动都要重新协商。
location ~* \.(?:ttf|otf|woff2?|png|jpe?g|webp|gif|svg|ico)$ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
}

# index.html **必须每次回源校验**：它没有内容 hash，而缓存里的旧 HTML 会引用构建
# 产物中已被删除的 chunk 名；那次请求会落到下面的 SPA 回退拿到 HTML，浏览器按
# module 解析失败 → 白屏。这是发版后最容易复现的线上事故。
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

# SPA 回退：/folder/6、/dashboard、/about、/settings 在 dist/ 里没有对应文件，
# 交给 index.html 由前端路由接管（BUG-97）。缺这段则刷新任何前端路由都是 404。
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
