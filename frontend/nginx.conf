# HTTP → HTTPS redirect
server {
    listen 80;
    server_name zyxf.top;
    return 301 https://$host$request_uri;
}

# 安全响应头：CSP 必须由托管 HTML 的这层下发（后端只服务 /api，管不到页面）。
# 注意 nginx 的 add_header 不会被子级 location 继承——凡是自己写了 add_header 的
# location（如 /assets/）都要重复声明，否则会静默丢失。
#   script-src 'self'           构建产物无内联脚本，无需 unsafe-inline
#   style-src 'unsafe-inline'   React 大量内联 style 属性
#   style-src googleapis        index.html 引入的 DM Sans 样式表（AboutPage 用）；缺这条
#                               会静默拦掉该样式表，页面字体退回 sans-serif 且控制台报 CSP 违规
#   connect-src https:          API + OSS + 用户自带 LLM 地址
#   frame-src https:            IMM WebOffice 预览 iframe
#   img-src https:              文件缩略图/外链图片
#   font-src fonts.gstatic.com  Google Fonts（index.html 引入 DM Sans）
# 建议首次上线先用 Content-Security-Policy-Report-Only 观察，确认无违规再切正式。

# HTTPS
server {
    listen 443 ssl;
    server_name zyxf.top;

    ssl_certificate     /etc/letsencrypt/live/zyxf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyxf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    root /opt/zyxf/frontend/dist;
    index index.html;

    # Long-cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 重复声明安全头（见上方说明：本级 add_header 会屏蔽 server 级继承）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Reverse-proxy API to the backend host.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the backend trusts the leftmost XFF entry
        # (trust proxy), so a client-supplied X-Forwarded-For must not pass through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 聊天走 SSE 流式响应：禁用缓冲，放宽读超时
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
