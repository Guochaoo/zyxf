# HTTP → HTTPS redirect
server {
    listen 80;
    server_name zyxf.top;
    return 301 https://$host$request_uri;
}

# 安全响应头：CSP 必须由托管 HTML 的这层下发（后端只服务 /api，管不到页面）。
# 注意 nginx 的 add_header 不会被子级 location 继承——凡是自己写了 add_header 的
# location（如 /assets/）都要重复声明，否则会静默丢失。
#   script-src 'self'           构建产物无内联脚本，无需 unsafe-inline
#   style-src 'unsafe-inline'   React 大量内联 style 属性
#   connect-src https:          API + OSS + 用户自带 LLM 地址
#   frame-src https:            IMM WebOffice 预览 iframe
#   img-src https:              文件缩略图/外链图片
#   font-src 'self' data:       自托管字体（OPPO Sans）；不再需要 fonts.gstatic.com
#   script-src g.alicdn.com     OfficeViewer 注入的 WPS WebOffice SDK（该脚本随后再
#                               appendChild 加载同目录的 wps.js）；缺这条在线预览整块失效
# ⚠️ CSP 目前下发为 **Report-Only**：先用真实浏览器把预览 / 上传 / 图谱 / AI 对话点一遍，
#    确认控制台无 CSP 违规后，再把本文件（与生产服务器上那份）的
#    `Content-Security-Policy-Report-Only` 全部改回 `Content-Security-Policy`。
#
# ⚠️ 本文件是**模板**。若站点由宝塔面板托管（当前生产就是），面板不会读这里——
#    必须把下面每个 location 同步进面板的「伪静态」，见 docs/DEPLOY.md §4.2。

# HTTPS
server {
    listen 443 ssl;
    server_name zyxf.top;

    ssl_certificate     /etc/letsencrypt/live/zyxf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyxf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    root /opt/zyxf/frontend/dist;
    index index.html;

    # Long-cache hashed assets. Filenames carry a content hash, so a year +
    # immutable is safe: changing content changes the URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 重复声明安全头（见上方说明：本级 add_header 会屏蔽 server 级继承）
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static files outside /assets/ (fonts, images, icons) have NO content hash in
    # their filename, so they get a shorter TTL than /assets/. Without this block
    # nginx sends no Cache-Control at all and the browser falls back to heuristic
    # caching — see docs/ISSUES.md BUG-100.
    location ~* \.(?:ttf|otf|woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated: it is NOT content-hashed, and a stale
    # copy references chunk filenames that the next build deletes. That request then
    # falls through to the SPA fallback and returns HTML for a .js URL, which the
    # browser refuses to execute as a module (blank page).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://g.alicdn.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Reverse-proxy API to the backend host.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the backend trusts the leftmost XFF entry
        # (trust proxy), so a client-supplied X-Forwarded-For must not pass through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 聊天走 SSE 流式响应：禁用缓冲，放宽读超时
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
