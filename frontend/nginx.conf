# ── 限流 / 限并发（http 级 zone 定义，conf.d 就是在 http 上下文里被 include 的）──
# 这些 zone 按 `$binary_remote_addr` 计数，而它已经被下面的 real_ip 指令换成了
# **真实客户端 IP**（主站 2026-11 起在 ESA 后面）。
# 静态资源首屏并发很高（7 个 chunk + 字体 + 图片），burst 必须先给足；
# 只压「持续高频」这一种形态，不误伤正常打开页面。
limit_req_zone  $binary_remote_addr zone=zyxf_req:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=zyxf_api:10m rate=6r/s;
limit_conn_zone $binary_remote_addr zone=zyxf_conn:10m;

# ── 客户端真实 IP（主站 2026-11 接入 ESA 之后）──
# ESA 的「托管转换 → 添加真实客户端 IP 标头」会在**回源请求**里注入 `ali-real-client-ip`，
# 由边缘节点写入——ESA 文档明确说它「比客户端可能伪造的 X-Forwarded-For 标头更可信」。
# 没有这个标头时（直连源站、或 ESA 之前）nginx 保持 $remote_addr 不变，行为与以前一致。
#
# ⚠️ 代价要说清楚：这里只能写 `0.0.0.0/0`——免费版没有「源站防护」，拿不到 ESA 的回源
#    网段列表（`CreateOriginProtection` 会报 FunctionQuotaCheckFailed），所以无法把
#    `set_real_ip_from` 收窄到节点网段。结果是：**直接连服务器 IP 并自带该标头的人
#    可以伪装来源**，从而绕过按 IP 的限流。这是接 CDN 的固有代价（真堵死要把防火墙
#    收窄到 ESA 回源网段，需要付费版或手工维护 IP 列表）。
#    注意它只影响「限流粒度」，不影响认证与权限。
set_real_ip_from 0.0.0.0/0;
real_ip_header ali-real-client-ip;

# HTTP → HTTPS redirect
# www 也收口在这里，而且直接跳到裸域：http://www → https://zyxf.top 一跳到位，
# 不会先 https://www 再 301 一次。
server {
    listen 80;
    server_name zyxf.top www.zyxf.top;

    # ACME HTTP-01 验证（certbot --webroot）。必须：
    #   ① 用 location 而不是 server 级 return —— server 级 return 在 rewrite 阶段执行，
    #      早于 location 匹配，会把挑战请求一起 301 走；
    #   ② 不走 https 跳转 —— 证书过期时 https 已经不可用，验证只能走 80。
    # 主站挂 ESA 之后，这一跳要穿过边缘才能到源站，所以 cache 规则里要把
    # /.well-known/ 设为不缓存（见 DEPLOY §4.2.5）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://zyxf.top$request_uri;
    }
}

# 安全响应头（CSP / HSTS / Permissions-Policy / COOP 等）**不在这里写**，统一在
# frontend/security-headers.conf —— 部署会把它拷到 /etc/nginx/snippets/zyxf-headers.conf。
# 原因：nginx 的 add_header 在子级一旦出现就不再继承父级那一组，以前每个 location 手抄一遍，
# HSTS 漏抄了半年没人发现。现在加头/改策略只改那个文件，每个 location 只需 include。
#
# ⚠️ 本文件是**唯一来源**：`.github/workflows/deploy.yml` 每次部署会把它拷到服务器的
#    /etc/nginx/conf.d/zyxf.conf，`nginx -t` 通过后才 reload，失败则还原上一份并让部署失败。
#    不要再手工 scp 改服务器上的那份——那正是 2026-11 之前 HSTS「文档有、配置没有」的原因。
#    （宝塔已彻底卸载，无需再同步「伪静态」。）

# HTTPS
server {
    # HTTP/2 必须写在 listen 上，不能用 `http2 on;`：后者是 nginx 1.25.1 才引入的指令，
    # 而 Ubuntu 22.04 自带的是 1.18.0——只写 `listen 443 ssl;` 会让整站退回 HTTP/1.1，
    # 每域 6 个并发连接，首屏 7 个 JS chunk 直接排队。
    listen 443 ssl http2;
    server_name zyxf.top;

    ssl_certificate     /etc/letsencrypt/live/zyxf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyxf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 压缩 ---
    # nginx 默认的 gzip_types 只有 text/html，所以 HTML 是压过的、.js/.css 一直是明文外传
    # （实测 /assets/index-*.js 172,825 字节，无 content-encoding）。下面这组是「够用且安全」
    # 的最小集合，不再加 gzip_static（构建产物里没有 .gz 副本）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm;

    # 安全响应头统一从 snippet 引入（唯一来源，见文件顶部说明）。
    include /etc/nginx/snippets/zyxf-headers.conf;

    client_max_body_size 10m;

    # 单 IP 并发连接 24：正常页面并发拉资源不会到这个数，挂一条 SSE 也不会。
    limit_conn zyxf_conn 24;
    limit_conn_status 429;
    # 请求速率：基线 20r/s + 突发 60（nodelay 让突发直接放行，不排队）。
    limit_req zone=zyxf_req burst=60 nodelay;
    limit_req_status 429;

    root /opt/zyxf/frontend/dist;
    index index.html;

    # ACME 验证目录在 443 上也放一份：Let's Encrypt 校验时如果先被 80 的 301 引到
    # https（ESA 边缘也可能自己改写），这条能兜住。没有 add_header，按 nginx 规则
    # 会继续继承 server 级那组安全头。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Long-cache hashed assets. Filenames carry a content hash, so a year +
    # immutable is safe: changing content changes the URL.
    # NOTE the `^~`: nginx prefers *regex* locations over plain prefix locations,
    # and the extension rule below also matches .woff2 — without `^~` the hashed
    # font would lose this rule and only get 7 days. `^~` means "prefix matched,
    # stop looking at regexes", so everything under /assets/ lands here.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 本级写了 add_header，就不再继承 server 级那组安全头，必须重新 include。
        include /etc/nginx/snippets/zyxf-headers.conf;
        try_files $uri =404;
    }

    # Static files outside /assets/ (images, icons) have NO content hash in their
    # filename, so they get a shorter TTL than /assets/. Without this block nginx
    # sends no Cache-Control at all and the browser falls back to heuristic
    # caching — see docs/ISSUES.md BUG-100.
    location ~* \.(?:ttf|otf|woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/zyxf-headers.conf;
        try_files $uri =404;
    }

    # index.html must always be revalidated: it is NOT content-hashed, and a stale
    # copy references chunk filenames that the next build deletes. That request then
    # falls through to the SPA fallback and returns HTML for a .js URL, which the
    # browser refuses to execute as a module (blank page).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/zyxf-headers.conf;
    }

    # 岱宗盒子（dzhz / xjtu-toolbox 项目）的**游戏排行榜后端**：仓库外的独立服务
    # （systemd: xjtu-games，代码在 /opt/xjtu-games，监听 127.0.0.1:4100）。
    # ⚠️ 根路径 `/games/` 本身没有路由，会返回它自己的 JSON 404
    # （`{"error":"没有这个接口"}`）——那是正常现象，探活别拿它当故障；排行榜用的是
    # /games/ 之下的具体接口。
    # 这块原先只存在于生产服务器上——按 DEPLOY.md「整文件覆盖」会把它删掉，排行榜与
    # 提交分数直接挂掉（issue #86）。收进模板后「模板 = 生产」才成立。
    #
    # 注意 XFF 是**追加**：主站 /api/ 因为 BUG-36 必须用 $remote_addr 覆盖，这里是另一套
    # 服务的约定，改成覆盖前要先确认 xjtu-games 自己的 trust proxy 取法。
    location ^~ /games/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 4k;
    }

    # Reverse-proxy API to the backend host.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the backend trusts the leftmost XFF entry
        # (trust proxy), so a client-supplied X-Forwarded-For must not pass through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API 单独一档更紧的速率：6r/s + 突发 20。后端自身也有 express-rate-limit，
        # 这一层的作用是让刷接口的请求在 nginx 就被挡住，不到 node 进程。
        limit_req zone=zyxf_api burst=20 nodelay;
        # AI 聊天走 SSE 流式响应：禁用缓冲，放宽读超时
        proxy_buffering off;
        # API 不压缩：gzip 会把 SSE 的增量输出攒进缓冲区，首字延迟反而变差；
        # 其余 JSON 响应本来就不大，压不压差别可以忽略。
        gzip off;
        proxy_read_timeout 120s;
    }

    # 岱宗盒子已迁到独立域名（2026-11-22，docs/DEPLOY.md §4.2.7）。旧链接、App 里的
    # 「用户协议与隐私政策」地址都还是 /dzhz…，统一 301 过去。
    # 只匹配 `/dzhz` 与 `/dzhz/…`：`/dzhz-assets/` 的前缀是 `/dzhz-`，不会被这两条吃掉。
    location = /dzhz { return 301 https://dzhz.zyxf.top/; }
    location ^~ /dzhz/ { return 301 https://dzhz.zyxf.top$request_uri; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# www → 裸域（301）。证书与主站同一张（`zyxf.top` 的 SAN 里带 `www.zyxf.top`，
# 见 DEPLOY §5 的 `--expand` 步骤）。
# 用独立 server 块而不是在主块里写 `if ($host = www...)`：server 级 if 容易踩
# 「if 是邪恶的」那类语义坑，而这里只需要一个纯重定向。
server {
    listen 443 ssl http2;
    server_name www.zyxf.top;

    ssl_certificate     /etc/letsencrypt/live/zyxf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyxf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 重定向响应也带上安全头（至少要有 HSTS，否则浏览器不会记住 www 只走 https）。
    include /etc/nginx/snippets/zyxf-headers.conf;

    return 301 https://zyxf.top$request_uri;
}

# ── 岱宗盒子独立域名 dzhz.zyxf.top（2026-11-22）─────────────────────────────
# 请求怎么走到这里：ESA 站点 zyxf.top 上有一条**回源规则**——`dzhz.zyxf.top` 上除
# `/xjtu-toolbox/` 之外的请求，改回源到 `origin.zyxf.top`（本机 nginx）；而
# `/xjtu-toolbox/*`（APK、stable.json、bulletin.json…）仍由 ESA 直接回源 OSS 私有桶。
# 所以这个 server 块里**不该出现**任何 /xjtu-toolbox 的处理，出现就是配错了。
#
# 为什么这样分：APK 一个包 85 MB，走这台 2C2G 的机器会被带宽卡死；页面和排行榜又必须
# 由 nginx 出。一条 ESA 记录只能有一个源站，按路径分流是唯一的折中（见 §4.2.7）。
#
# 白名单式路由：只放行落地页要用的几条路径，其余一律 301 回主站，避免这个域名变成
# 整站的副本（那样 SEO、登录态、分享链接都会出现两套）。
server {
    listen 80;
    server_name dzhz.zyxf.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://dzhz.zyxf.top$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name dzhz.zyxf.top;

    # 与主站同一张源站证书（certbot --expand 把 dzhz.zyxf.top 加进了 SAN）。
    # ESA → 源站这一段靠它校验；缺 SAN 就只能把回源规则的「源站证书校验」关掉。
    ssl_certificate     /etc/letsencrypt/live/zyxf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyxf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/zyxf-headers.conf;
    root /opt/zyxf/frontend/dist;

    client_max_body_size 1m;

    # 落地页入口：都吐 index.html，由前端按 host 决定渲染哪一页（App.jsx 的 isDzhzHost）。
    # `expires -1` 等价于 Cache-Control: no-cache，且不像 add_header 那样掐掉 server 级的
    # 安全头继承（nginx 里 add_header 一旦在子级出现，就不再继承父级那一组）。
    location = /        { expires -1; try_files /index.html =404; }
    location = /legal   { expires -1; try_files /index.html =404; }
    location = /license { expires -1; try_files /index.html =404; }
    # 从主站 301 过来的路径原样带着 /dzhz 前缀，交给 SPA 自己按路由渲染。
    location = /dzhz   { expires -1; try_files /index.html =404; }
    location ^~ /dzhz/ { expires -1; try_files /index.html =404; }

    # SPA 拆包与落地页图片。
    location ^~ /assets/      { expires 365d; try_files $uri =404; }
    location ^~ /dzhz-assets/ { expires 30d;  try_files $uri =404; }
    location = /favicon.png   { expires 7d;   try_files /favicon.png =404; }
    location = /favicon.ico   { expires 7d;   try_files /favicon.ico =404; }

    # 排行榜后端（systemd: xjtu-games，127.0.0.1:4100）。与主站是同一个上游；
    # 主站那条继续保留，兼容硬编码了 zyxf.top/games 的旧版 App。
    location ^~ /games/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 4k;
    }

    # 登录态探测（/api/auth/me）打到这里时别变成跨域报错：直接转给后端。
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip off;
        proxy_read_timeout 30s;
    }

    # 其余路径不属于岱宗盒子，回主站。
    location / { return 301 https://zyxf.top$request_uri; }
}