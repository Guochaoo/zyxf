# HTTP → HTTPS redirect
server {
    listen 80;
    server_name zyxf.top;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name zyxf.top;

    ssl_certificate     /etc/letsencrypt/live/zyxf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyxf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    root /opt/zyxf/frontend/dist;
    index index.html;

    # Long-cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API to the backend host.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the backend trusts the leftmost XFF entry
        # (trust proxy), so a client-supplied X-Forwarded-For must not pass through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 聊天走 SSE 流式响应：禁用缓冲，放宽读超时
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
