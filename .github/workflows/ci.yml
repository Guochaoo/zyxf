name: CI

# 安全：所有 action 固定到不可变 commit SHA，避免上游 tag 被篡改/重定向
# （与 deploy.yml 同口径，见 BUG-19）。升级时用
# `git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<tag>` 重新解析 SHA。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # `npm test` relies on node:test's mock.module, which requires the
      # --experimental-test-module-mocks flag on Node 24. Do not remove the
      # flag from backend/package.json without re-verifying tests still pass,
      # and re-check when bumping the Node major version.
      - run: npm test

  frontend-test:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
