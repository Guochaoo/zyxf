name: Deploy to Server

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # appleboy/ssh-action@v1 固定到不可变 commit SHA，避免上游 tag 被
        # 篡改/重定向（供应链风险）。v1 为轻量 tag，直接指向提交
        # 0ff4204d...（与 v1.2.5 同一提交）。依赖机器人（如 Renovate 的
        # digest 更新）应用 `git ls-remote https://github.com/appleboy/ssh-action.git refs/tags/v1`
        # 重新解析该 tag 对应的 SHA，并把新 SHA 同步到此处。
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd /opt/zyxf
            git config --global --add safe.directory /opt/zyxf
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git pull origin main

            # ----------------------------------------------------------------
            # 配置 Docker 走阿里云专属加速器（根治：绕开 docker.io 停滞节点）
            # ----------------------------------------------------------------
            # 服务器为阿里云 ECS，控制台分配了专属加速器 k0sdnixc.mirror.aliyuncs.com。
            # 只有该 ECS 本机/内网可达（公网访问返回 403 属正常鉴权），因此从服务器
            # 拉取基础镜像走专线，快且稳定，不再依赖 docker.io 的间歇性连接。
            # 注意：/etc/docker/daemon.json 的 registry-mirrors 遵循"最后一个兜底"语义，
            # 即列表里的镜像源都失败时才回退到官方源。配合后面的 pull_with_retry，
            # 二者互为兜底。仅在首次写入时重启一次 docker，幂等。
            MIRROR="https://k0sdnixc.mirror.aliyuncs.com"
            DAEMON=/etc/docker/daemon.json
            if [ "$(id -u)" = "0" ] && command -v docker >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
              mkdir -p /etc/docker
              # 确保文件存在且为合法 JSON；否则重置为 {}
              if [ ! -f "$DAEMON" ] || ! jq -e . "$DAEMON" >/dev/null 2>&1; then
                echo '{}' > "$DAEMON"
              fi
              # 幂等：已含 MIRROR 则跳过；否则插入并重启 docker（仅在真正改动时重启一次）
              if jq -e --arg m "$MIRROR" '."registry-mirrors" // [] | index($m)' "$DAEMON" >/dev/null 2>&1; then
                echo "镜像加速器 $MIRROR 已配置，跳过"
              else
                jq --arg m "$MIRROR" \
                   '."registry-mirrors" = (([$m] + (."registry-mirrors" // [])) | unique)' \
                   "$DAEMON" > "$DAEMON.tmp" && mv "$DAEMON.tmp" "$DAEMON"
                systemctl restart docker || service docker restart || true
                echo "已写入镜像加速器 $MIRROR 并重启 docker"
              fi
            else
              echo "（跳过加速器配置：需 root 且已安装 docker 与 jq）"
            fi

            # ----------------------------------------------------------------
            # 带重试地预拉取基础镜像，绕开 docker.io 的间歇性停滞
            # ----------------------------------------------------------------
            # 之前失败是 `docker compose build` 拉取 node:24-slim 的一个 layer
            # 在 docker.io 上停滞，直至命令超时。Docker 分层缓存保证：某层下载
            # 成功即永久缓存到磁盘，重试只会补还没下载的层，因此杀掉重连是安全
            # 且有效的；镜像入缓存后，后续 compose build 不再触网。单一镜像哪怕
            # 单次 pull 卡死，也会在 timeout 后被重试接管，不会再让整条 build 卡住。
            pull_with_retry() {
              img="$1"
              for i in 1 2 3; do
                echo "== docker pull ${img} (attempt ${i}/3) =="
                timeout 300 docker pull "$img" && return 0
                echo "   pull ${img} attempt ${i} failed, retrying in 10s..."
                sleep 10
              done
              echo "ERROR: failed to pull ${img}" >&2
              return 1
            }

            pull_with_retry node:24-slim
            pull_with_retry node:24-alpine
            pull_with_retry nginx:1.27-alpine

            docker compose up -d --build --remove-orphans
            docker image prune -f
