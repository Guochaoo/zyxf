name: Deploy to Server

on:
  push:
    branches: [main, master]

# 手动部署（宝塔 Node + nginx），不再使用 Docker。
# 流程：SSH 上服务器 → git pull → 后端装依赖并重启 → 前端装依赖并构建。
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # appleboy/ssh-action@v1 固定到不可变 commit SHA，避免上游 tag 被
        # 篡改/重定向（供应链风险）。v1 为轻量 tag，直接指向提交
        # 0ff4204d...（与 v1.2.5 同一提交）。依赖机器人（如 Renovate 的
        # digest 更新）应用 `git ls-remote https://github.com/appleboy/ssh-action.git refs/tags/v1`
        # 重新解析该 tag 对应的 SHA，并把新 SHA 同步到此处。
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd /opt/zyxf
            git config --global --add safe.directory /opt/zyxf
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git pull origin main

            # ----------------------------------------------------------------
            # 后端：装依赖 + 重启（宝塔 Node 项目，进程 = www 用户跑的
            # `node src/index.js`，监听 4000）。不用 Docker，也不用 pm2。
            # ----------------------------------------------------------------
            cd /opt/zyxf/backend
            # 用宝塔安装的 Node 24（避免 fallback 到系统旧 Node 12）
            export PATH="/www/server/nodejs/v24.20.0/bin:$PATH"
            # better-sqlite3 从 npmmirror 拉预编译二进制（绕开 GitHub），
            # 必须以环境变量形式传入（不能 `npm config set better_sqlite3_binary_host`，
            # 那不是合法的 npm option，会导致报错退出）。
            export npm_config_better_sqlite3_binary_host=https://registry.npmmirror.com/-/binary/better-sqlite3
            npm config set registry https://registry.npmmirror.com
            npm install --no-audit --no-fund

            # 幂等重启：杀掉监听 4000 的旧后端进程，再以 www 用户后台拉起。
            # 注意 1：不能用 `pkill -f "node src/index.js"` —— -f 按完整命令行匹配，
            # 会误杀正执行本部署脚本的 bash（它的参数里含有该字符串），导致整个
            # deploy 被 SIGTERM 终止（status 143）。所以改按端口定位。
            # 注意 2：kill 后需重新启动，因为宝塔的 Node 项目不会因依赖变化自动重启。
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 4000/tcp 2>/dev/null || true
            else
              # 回退：用 [n]ode 技巧避免 grep 匹配自身，并按 PID 精确 kill
              # （不按完整命令行 -f 匹配，以免误杀本部署脚本进程）。
              ps -eo pid,args | grep '[n]ode src/index.js' | awk '{print $1}' | xargs -r kill 2>/dev/null || true
            fi
            sleep 1
            # 以 www 用户从 backend 目录后台启动，日志写入 run.log。
            # 必须用 Node 24 的绝对路径：`su` 切换用户后 PATH 是系统默认
            # （/usr/bin/node = v12），跑 express-rate-limit/helmet 等现代包会
            # 抛 SyntaxError（`?.`/`??` 语法），导致后端起不来。手动验证过，
            # 用 v24 绝对路径启动后端可正常返回 /api/health。
            su -s /bin/bash www -c "cd /opt/zyxf/backend && nohup /www/server/nodejs/v24.20.0/bin/node src/index.js >> run.log 2>&1 &"
            sleep 3
            # 健康检查：确认后端起来（写库/加载环境变量失败会在此暴露）。
            curl -fsS http://127.0.0.1:4000/api/health

            # ----------------------------------------------------------------
            # 前端：装依赖 + 构建（产物交给 nginx，无需常驻进程）
            # ----------------------------------------------------------------
            cd /opt/zyxf/frontend
            export PATH="/www/server/nodejs/v24.20.0/bin:$PATH"
            npm config set registry https://registry.npmmirror.com
            npm install --no-audit --no-fund
            npm run build
