name: Deploy to Server

on:
  push:
    branches: [main]
  # 手工重跑：只改了服务器状态（或想复跑一次部署）时不必再制造一个提交。
  workflow_dispatch:

# 同一次生产部署串行化：两次 push 挨得近时两个 job 会并发在同一台服务器上执行
# git reset --hard + npm ci + systemctl，互相覆盖文件并把服务停在两次修订混合的中间态。
# cancel-in-progress: false 让排队的那次等前一次跑完。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 最小权限：部署只读仓库内容（服务器凭据走 SSH secrets）。
permissions:
  contents: read

# 前端在 GitHub runner 上构建，服务器只负责「装后端依赖 + 换产物 + 重启 + reload nginx」。
# 这样做的原因：2C2G 的生产机跑 vite + WASM 字体子集化是整条链的内存峰值（原先要靠
# 一个 2 GB swap 兜 OOM），而它真正需要做的只是把 5.7 MB 的 dist 派发出去。
#
# 构建和部署放在同一个 job 里：跑的就是刚构建出来的那一份，省掉 artifact 上传/下载这一跳，
# 也避免「部署了一份跟构建结果不一致的产物」。
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端产物
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          # 退出码 0 不代表产物可用：outDir/插件配置改错时 vite 照样成功退出并产出空目录，
          # 交给 nginx 就是白屏。与 ci.yml 的断言同口径。
          test -s dist/index.html
          test "$(find dist/assets -name '*.js' | wc -l)" -gt 0
          test "$(find dist/assets -name '*.css' | wc -l)" -gt 0
          tar -czf "$RUNNER_TEMP/dist.tar.gz" -C dist .

      - name: 上传产物并部署
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          chmod 600 "$key"
          # 未知主机指纹采用 accept-new：runner 是一次性的，没有可复用的 known_hosts
          # （与原 appleboy/ssh-action 的信任模型一致，没有额外放宽）。
          ssh_opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p "$SERVER_PORT")
          scp_opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -P "$SERVER_PORT")
          scp "${scp_opts[@]}" "$RUNNER_TEMP/dist.tar.gz" "$SERVER_USER@$SERVER_HOST:/tmp/zyxf-dist.tar.gz"

          # 对齐工作区这一步必须在仓库里的 deploy/deploy.sh 之外：新脚本要等 reset 之后
          # 才落到服务器上，而第一次跑新流程时工作区里还是旧修订。
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            cd /opt/zyxf
            # 工作区属主是 admin、部署以 root 执行，git 会以 dubious ownership 拒绝操作。
            git config --global --replace-all safe.directory /opt/zyxf
            PREV=$(git rev-parse HEAD)
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            PREV_SHA=$PREV BUNDLE=/tmp/zyxf-dist.tar.gz bash deploy/deploy.sh
          '
