name: Deploy to Server

on:
  push:
    branches: [main, master]

# 同一次生产部署串行化：两次 push 挨得近时两个 job 会并发在同一台服务器上执行
# git reset --hard + npm install + systemctl start，互相覆盖文件并把服务停在
# 两次修订混合的中间态。cancel-in-progress: false 让排队的那次等前一次跑完。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 最小权限：部署只读仓库内容（服务器凭据走 SSH secrets）。
permissions:
  contents: read

# 标准 SSH 部署：后端用 systemd 托管（zyxf.service），前端构建产物交给 nginx。
# 流程：SSH 上服务器 → git pull → 装依赖 → 构建前端 → systemctl 重启后端。
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # appleboy/ssh-action@v1 固定到不可变 commit SHA，避免上游 tag 被
        # 篡改/重定向（供应链风险）。v1 为轻量 tag，直接指向提交
        # 0ff4204d...（与 v1.2.5 同一提交）。依赖机器人（如 Renovate 的
        # digest 更新）应用 `git ls-remote https://github.com/appleboy/ssh-action.git refs/tags/v1`
        # 重新解析该 tag 对应的 SHA，并把新 SHA 同步到此处。
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd /opt/zyxf
            # 回滚基线：本次部署前的修订。健康检查失败时据此回退（人工排障也可直接执行
            # `git reset --hard <该 SHA>` + 重新构建）。
            PREV=$(git rev-parse HEAD)
            git config --global --add safe.directory /opt/zyxf
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

            # 强制对齐到远程 main：服务器是部署目标，工作区不应保留任何被 git
            # 跟踪文件的本地改动（如 npm install 改过的 package-lock.json）。
            # reset --hard 只碰被跟踪文件，.env / data.db 均被 gitignore 不受影响。
            git fetch origin main
            git reset --hard origin/main

            # Node 24 走系统包（NodeSource，/usr/bin/node，v24.21+）。
            # 旧写法 export PATH="/www/server/nodejs/..." 随宝塔卸载已废弃（IMPROVE-48）。
            npm config set registry https://registry.npmmirror.com

            # 后端：装依赖
            cd /opt/zyxf/backend
            npm install --no-audit --no-fund

            # 前端：装依赖 + 构建（产物交给 nginx，无需常驻进程）
            cd /opt/zyxf/frontend
            npm install --no-audit --no-fund

            # vite build 会先清空 dist/，若残留带 immutable 位的 .user.ini
            # 会导致 emptyDir 阶段 EPERM，先解锁删除再构建。
            if [ -f /opt/zyxf/frontend/dist/.user.ini ]; then
              chattr -i /opt/zyxf/frontend/dist/.user.ini 2>/dev/null || true
              rm -f /opt/zyxf/frontend/dist/.user.ini || true
            fi
            npm run build

            # 安装/更新 systemd 服务并重启后端（首次部署也会自举：enable + daemon-reload）。
            cp /opt/zyxf/deploy/zyxf.service /etc/systemd/system/zyxf.service
            systemctl daemon-reload
            systemctl enable zyxf

            # 先优雅停掉 systemd 旧实例，再清理仍占用 4000 的残留进程。
            # 从宝塔/nohup 迁移到 systemd 的过渡期，旧后端可能不是 systemd 启动、
            # 仍占着 4000，若不释放会让 systemd 起服务报 EADDRINUSE 反复重启失败。
            # 按端口精确定位，避免 `pkill -f` 误杀本部署脚本自身。
            systemctl stop zyxf 2>/dev/null || true
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 4000/tcp 2>/dev/null || true
            else
              ss -tlnp 2>/dev/null | awk '/:4000 /{match($0, /pid=([0-9]+)/, m); if (m[1]) print m[1]}' | sort -u | xargs -r kill 2>/dev/null || true
            fi
            systemctl start zyxf

            sleep 3
            # 健康检查：确认后端起来（写库/加载环境变量失败会在此暴露）。
            if curl -fsS http://127.0.0.1:4000/api/health; then
              exit 0
            fi

            # 健康检查失败 = 新修订起不来。此时前端 dist/ 已被新构建覆盖、新代码也已就位，
            # 直接留在新修订上会让线上持续 502，所以退回部署前的修订并重建，至少恢复可用。
            # 注意：回滚会把本地分支指针退回 PREV，与 origin/main 暂时分叉；下次部署的
            # `git reset --hard origin/main` 会自动重新对齐，属预期行为。
            echo "::error::health check failed on $(git rev-parse --short HEAD), rolling back to ${PREV}"
            cd /opt/zyxf
            git reset --hard "$PREV"
            cd /opt/zyxf/backend
            npm install --no-audit --no-fund
            cd /opt/zyxf/frontend
            npm install --no-audit --no-fund
            npm run build
            systemctl restart zyxf
            sleep 3
            curl -fsS http://127.0.0.1:4000/api/health || true
            echo "::error::rolled back to ${PREV}: 回滚已完成，但本次部署判定为失败"
            exit 1
